[build]
  publish = "public"
  functions = "netlify/functions"
  # Économie de builds : Netlify ne construit QUE la production (branche main).
  # Les pushs sur dev (et les aperçus de pull request) sont annulés avant le build.
  # Règle Netlify : la commande "ignore" qui renvoie 0 = build annulé.
  ignore = 'test "$CONTEXT" != "production"'

[functions]
  node_bundler = "esbuild"

# /admin sert la page admin.html
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
