<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — La Hutte Enchanté</title>
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Bitter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">

  <header class="admin-bar">
    <a href="/" class="brand"><img src="/img/ours-256.png" alt="" width="44" height="44"> La Hutte <span>Admin</span></a>
    <button class="link-btn" id="logout" hidden>Déconnexion</button>
  </header>

  <!-- Connexion -->
  <section class="login" id="login">
    <form id="login-form" class="panel">
      <img src="/img/ours-256.png" alt="" class="login-bear" width="140" height="140">
      <h1>Espace gérant</h1>
      <label for="password">Mot de passe</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Entrer dans la hutte</button>
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </section>

  <!-- Éditeur -->
  <main class="editor" id="editor" hidden>
    <div class="editor-head">
      <div>
        <h1>Gérer la hutte</h1>
        <p class="muted">Les modifications sont visibles sur le site dès que vous enregistrez.</p>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="add-cat" type="button">+ Catégorie</button>
        <button class="btn" id="save" type="button">Enregistrer</button>
      </div>
    </div>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="tab-bareme" role="tab">Barème</button>
      <button type="button" class="tab" data-tab="tab-sessions" role="tab">Sessions de chasse</button>
    </nav>

    <div id="tab-bareme" class="tab-panel">
      <p class="hint">Laissez « Rachat » vide si vous ne rachetez pas l'article. Cliquez sur la vignette pour ajouter l'image de l'article.</p>
      <div id="cats"></div>
    </div>

    <div id="tab-sessions" class="tab-panel" hidden>
      <section class="panel cat">
        <label class="field-label" for="reservation">Comment réserver (affiché sous les sessions)</label>
        <input id="reservation" type="text" maxlength="300" placeholder="ex : Réservation en jeu ou sur Discord">
      </section>
      <div id="sessions"></div>
      <button class="btn btn-ghost" id="add-session" type="button">+ Ajouter une session</button>
    </div>
  </main>
  <input type="file" id="file-pick" accept="image/png,image/jpeg,image/webp,image/gif" hidden>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Modèles -->
  <template id="tpl-cat">
    <section class="cat panel">
      <div class="cat-head">
        <input class="cat-name" type="text" maxlength="60" placeholder="Nom de la catégorie" aria-label="Nom de la catégorie">
        <div class="cat-tools">
          <button type="button" class="icon-btn" data-act="cat-up" title="Monter">↑</button>
          <button type="button" class="icon-btn" data-act="cat-down" title="Descendre">↓</button>
          <button type="button" class="icon-btn danger" data-act="cat-del" title="Supprimer la catégorie">✕</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Image</th><th>Article</th><th>Vente</th><th>Rachat</th><th>Devise</th><th>Unité</th><th>Dispo</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <button type="button" class="link-btn" data-act="item-add">+ Ajouter un article</button>
    </section>
  </template>

  <template id="tpl-item">
    <tr>
      <td class="img-cell">
        <button type="button" class="img-btn" data-act="img-pick" title="Choisir une image"><span>+</span></button>
        <button type="button" class="img-link" data-act="img-url" title="Coller un lien d'image">lien</button>
        <input class="f-image" type="hidden">
      </td>
      <td><input class="f-nom" type="text" maxlength="80" placeholder="Nom de l'article" aria-label="Article"></td>
      <td><input class="f-vente" type="number" min="0" step="1" inputmode="numeric" aria-label="Prix de vente"></td>
      <td><input class="f-rachat" type="number" min="0" step="1" inputmode="numeric" placeholder="—" aria-label="Prix de rachat"></td>
      <td>
        <select class="f-devise" aria-label="Devise">
          <option value="$">$</option>
          <option value="or">Or</option>
        </select>
      </td>
      <td><input class="f-unite" type="text" maxlength="30" placeholder="ex : pièce" aria-label="Unité"></td>
      <td class="center"><input class="f-dispo" type="checkbox" aria-label="Disponible"></td>
      <td class="row-tools">
        <button type="button" class="icon-btn" data-act="item-up" title="Monter">↑</button>
        <button type="button" class="icon-btn" data-act="item-down" title="Descendre">↓</button>
        <button type="button" class="icon-btn danger" data-act="item-del" title="Supprimer">✕</button>
      </td>
    </tr>
  </template>

  <template id="tpl-session">
    <section class="panel cat session-edit">
      <div class="cat-head">
        <input class="s-nom cat-name" type="text" maxlength="80" placeholder="Nom de la session" aria-label="Nom de la session">
        <div class="cat-tools">
          <button type="button" class="icon-btn" data-act="s-up" title="Monter">↑</button>
          <button type="button" class="icon-btn" data-act="s-down" title="Descendre">↓</button>
          <button type="button" class="icon-btn danger" data-act="s-del" title="Supprimer la session">✕</button>
        </div>
      </div>
      <textarea class="s-desc" maxlength="600" rows="3" placeholder="Description : ce qu'on fait, ce qui est fourni…" aria-label="Description"></textarea>
      <div class="s-grid">
        <label>Niveau<input class="s-niveau" type="text" maxlength="30" placeholder="Débutant"></label>
        <label>Durée<input class="s-duree" type="text" maxlength="40" placeholder="1 h"></label>
        <label>Places<input class="s-places" type="text" maxlength="30" placeholder="4 joueurs max"></label>
        <label>Prix<input class="s-prix" type="number" min="0" step="1" placeholder="—"></label>
        <label>Devise<select class="s-devise"><option value="$">$</option><option value="or">Or</option></select></label>
        <label class="check"><input class="s-dispo" type="checkbox"> Places dispo</label>
      </div>
    </section>
  </template>

  <script src="/js/prices-common.js" defer></script>
  <script src="/js/admin.js" defer></script>
</body>
</html>
